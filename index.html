<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معمل كريم | Karim Dental Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8FD;--surface:#fff;--ink:#1D1738;--muted:#5E5878;--brand:#43347F;--brand2:#6B58C8;--ivory:#F6F0E6;--tint:#EDE8F8;--line:#D9D2EC;--wa:#1F8A4C;--logo:#433279;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F29;--surface:#1F1839;--ink:#F1EEFA;--muted:#B5AED0;--brand:#9C8BEA;--tint:#2B2350;--line:#3A3162;--wa:#3FBF77}}
:root[data-theme="dark"]{--bg:#150F29;--surface:#1F1839;--ink:#F1EEFA;--muted:#B5AED0;--brand:#9C8BEA;--tint:#2B2350;--line:#3A3162;--wa:#3FBF77}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.25;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
#bar{position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,var(--brand2),#E9C46A);transform-origin:left;transform:scaleX(0);z-index:60}
#glow{position:fixed;width:380px;height:380px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(140,120,240,.22),transparent 65%);transform:translate(-50%,-50%);left:var(--x,50%);top:var(--y,-300px);z-index:1}
/* nav */
nav{position:fixed;top:0;inset-inline:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
nav.s{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.nl{display:flex;gap:6px;align-items:center}
.nl a{text-decoration:none;padding:8px 12px;border-radius:10px;font:500 15px "Readex Pro",sans-serif;color:var(--ivory)}
nav.s .nl a{color:var(--ink)}
.nl a:hover{background:rgba(140,120,240,.2)}
.nb{height:46px;border-radius:12px;background:var(--logo);display:block;padding:4px 8px}
.nb img{height:100%;display:block}
.lang,.menu{font:500 14px "Readex Pro",sans-serif;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--ivory);padding:7px 14px;border-radius:999px;cursor:pointer}
nav.s .lang,nav.s .menu{color:var(--ink);border-color:var(--line)}
.menu{display:none}
@media(max-width:820px){.menu{display:block}.nl{position:absolute;top:100%;inset-inline:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:10px 20px;display:none;border-bottom:1px solid var(--line)}.nl.o{display:flex}.nl a{color:var(--ink)}}
/* hero */
.hero{position:relative;min-height:100svh;background:linear-gradient(160deg,#241A52,#43347F 60%,#5A47A8);color:var(--ivory);display:flex;align-items:center;overflow:hidden;padding:110px 0 70px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:#7B63E0;top:-100px;inset-inline-start:-80px}
.b2{width:360px;height:360px;background:#E9C46A;opacity:.25;bottom:-120px;inset-inline-end:-60px;animation-delay:-5s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.fl{position:absolute;width:var(--s);aspect-ratio:.9;opacity:.16;color:#fff;left:var(--l);top:var(--t);animation:fy 9s ease-in-out infinite;animation-delay:var(--d)}
@keyframes fy{50%{transform:translateY(-34px) rotate(14deg)}}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(38px,7vw,74px);font-weight:700}
.w{display:inline-block;opacity:0;transform:translateY(40px) rotate(4deg);animation:wi .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .5s);margin-inline-end:.28em}
@keyframes wi{to{opacity:1;transform:none}}
.hero p{font-size:19px;max-width:46ch;margin:20px 0 30px;opacity:0;animation:wi 1s 1.4s forwards}
.btns{display:flex;flex-wrap:wrap;gap:12px;opacity:0;animation:wi 1s 1.7s forwards}
.btn{position:relative;overflow:hidden;display:inline-block;padding:14px 28px;border-radius:14px;font:600 17px "Readex Pro",sans-serif;text-decoration:none;border:2px solid var(--ivory);color:var(--ivory);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.m{background:var(--ivory);color:#2E2360}
.btn.m::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:sh 3.2s infinite}
@keyframes sh{60%,100%{left:130%}}
.logo-big{position:relative;justify-self:center;width:min(100%,360px);animation:pop 1.2s cubic-bezier(.2,1.4,.3,1) .2s both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.logo-big .card{background:var(--logo);border-radius:40px;padding:34px 26px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:fy2 6s ease-in-out infinite}
@keyframes fy2{50%{transform:translateY(-14px)}}
.logo-big img{width:100%;display:block}
.ring{position:absolute;inset:-22px;border:2px dashed rgba(246,240,230,.5);border-radius:56px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.logo-big{order:-1;width:240px}}
/* marquee */
.mq{background:var(--ivory);color:#2E2360;overflow:hidden;direction:ltr;padding:14px 0;font:600 18px "Readex Pro",sans-serif}
.mq div{display:flex;width:max-content;animation:mq 28s linear infinite}
.mq span{padding:0 28px;white-space:nowrap}
.mq span::before{content:"\25CF";color:#6B58C8;margin-inline-end:56px;font-size:10px;vertical-align:middle}
@keyframes mq{to{transform:translateX(-50%)}}
/* sections */
section{padding:84px 0;position:relative;z-index:2}
h2{font-size:clamp(28px,5vw,44px);color:var(--brand);margin-bottom:12px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 40px}
.rv{opacity:0;transform:translateY(46px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.st b{display:block;font:700 46px "Readex Pro",sans-serif;color:var(--brand);direction:ltr}
.st span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;transition:transform .15s,box-shadow .3s;transform:perspective(700px) rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.card:hover{box-shadow:0 20px 50px rgba(67,52,127,.2)}
.card svg{width:44px;height:46px;color:var(--c,var(--brand2));margin-bottom:12px;transition:transform .5s}
.card:hover svg{transform:rotate(360deg) scale(1.15)}
.card h3{font-size:21px;margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:16px}
/* shade matcher */
.sm{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;background:var(--tint);border-radius:28px;padding:34px}
.big{width:min(100%,230px);margin:auto;color:var(--tc,#F2E8D3);filter:drop-shadow(0 18px 24px rgba(0,0,0,.25));transition:color .5s}
.big path{stroke:rgba(0,0,0,.15);stroke-width:1.5}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px;direction:ltr}
.sw button{width:54px;height:62px;border-radius:12px 12px 24px 24px;border:3px solid transparent;background:var(--c);font:600 13px "Readex Pro",sans-serif;color:#4a4034;cursor:pointer;transition:transform .2s,border-color .2s}
.sw button:hover{transform:translateY(-6px)}
.sw button[aria-pressed="true"]{border-color:var(--brand);transform:translateY(-8px) scale(1.08)}
#sn{font:700 26px "Readex Pro",sans-serif;color:var(--brand)}
@media(max-width:760px){.sm{grid-template-columns:1fr;padding:22px}}
/* steps */
.steps{position:relative;list-style:none;margin:0;padding:0 0 0 0}
.steps::before,.steps::after{content:"";position:absolute;inset-inline-start:21px;top:10px;bottom:10px;width:3px;background:var(--line);border-radius:3px}
.steps::after{background:var(--brand2);transform-origin:top;transform:scaleY(var(--p,0))}
.steps li{position:relative;padding:0 64px 36px 0;padding-inline:64px 0}
.steps li::before{content:attr(data-n);position:absolute;inset-inline-start:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--brand2);color:var(--brand);font:700 18px/38px "Readex Pro",sans-serif;text-align:center;z-index:2}
.steps b{display:block;font:600 20px "Readex Pro",sans-serif}
.steps span{color:var(--muted)}
/* work */
var ba=$('#ba'),rg=$('input',ba),touched=false;
function sp(v){ba.style.setProperty('--p',v+'%')}
rg.addEventListener('input',function(){touched=true;sp(rg.value)});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){sp(96);var bo=new IntersectionObserver(function(es){if(es[0].isIntersecting){bo.disconnect();var t0=null;(function f(t){t0=t0||t;var p=Math.min(1,(t-t0)/1700);if(touched)return;var v=96-46*(1-Math.pow(1-p,3));sp(v);rg.value=v;if(p<1)requestAnimationFrame(f)})(performance.now())}},{threshold:.5});bo.observe(ba)}
var gis=$$('.gi');
$$('#chips button').forEach(function(b){b.onclick=function(){$$('#chips button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');var f=b.dataset.f;
 gis.forEach(function(g){var m=f==='all'||g.dataset.c===f;if(m&&g.hidden){g.hidden=false;g.classList.add('sh');setTimeout(function(){g.classList.remove('sh')},600)}else if(!m&&!g.hidden){g.classList.add('out');setTimeout(function(){g.hidden=true;g.classList.remove('out')},300)}})}});
var lb=$('#lb'),li=$('img',lb);
function openLb(src){li.src=src;lb.classList.add('o')}
function closeLb(){lb.classList.remove('o')}
gis.forEach(function(g){g.onclick=function(){openLb($('img',g).src)};g.onkeydown=function(e){if(e.key==='Enter')openLb($('img',g).src)}});
$$('.pair img').forEach(function(i){i.onclick=function(){openLb(i.src)}});
lb.onclick=closeLb;addEventListener('keydown',function(e){if(e.key==='Escape')closeLb()});
/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px;margin-bottom:12px}
summary{cursor:pointer;font:600 18px "Readex Pro",sans-serif;padding:14px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-size:26px;color:var(--brand2);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 16px;color:var(--muted)}
/* contact */
.ct{background:linear-gradient(150deg,#2E2360,#43347F);color:var(--ivory);border-radius:30px;padding:44px 30px;display:grid;grid-template-columns:1fr 1fr;gap:34px}
.ct h2{color:inherit}
.ct .btn{margin:0 0 10px;margin-inline-end:8px}
form{display:grid;gap:12px}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.12);color:var(--ivory)}
input::placeholder,textarea::placeholder{color:rgba(246,240,230,.7)}
select option{color:#1D1738}
input:focus,select:focus,textarea:focus{border-color:var(--ivory);outline:none}
form button{cursor:pointer;background:var(--wa);border-color:var(--wa);color:#fff}
.ph{direction:ltr;unicode-bidi:embed;display:inline-block}
@media(max-width:760px){.ct{grid-template-columns:1fr;padding:28px 20px}}
footer{padding:30px 0 40px;text-align:center;color:var(--muted);font-size:14px;position:relative;z-index:2}
.wa-fab{position:fixed;inset-block-end:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline-start:18px;z-index:55;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;animation:pulse 2.2s infinite;text-decoration:none}
.wa-fab svg{width:30px;height:30px;color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,119,.6)}100%{box-shadow:0 0 0 22px rgba(63,191,119,0)}}

.ba-grid{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:22px;align-items:start;justify-content:center}
.ba{position:relative;aspect-ratio:1010/1462;overflow:hidden;border-radius:22px;direction:ltr;background:#000;box-shadow:0 20px 50px rgba(67,52,127,.25)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .af{clip-path:inset(0 0 0 var(--p,50%))}
.hd{position:absolute;top:0;bottom:0;left:var(--p,50%);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 14px rgba(0,0,0,.5);pointer-events:none}
.hd::after{content:"\2194";position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:#fff;color:#43347F;display:grid;place-items:center;transform:translate(-50%,-50%);font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pl 2.4s infinite}
@keyframes pl{50%{transform:translate(-50%,-50%) scale(1.12)}}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize;touch-action:pan-y;z-index:3}
.tg{position:absolute;top:12px;padding:4px 16px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:600 14px "Readex Pro",sans-serif;z-index:2;pointer-events:none}
.tg.l{left:12px}.tg.r{right:12px}
.pair{display:grid;gap:14px}
.pair figure{position:relative;margin:0;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:#111}
.pair img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pair figure:hover img{transform:scale(1.06)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:52px 0 20px}
.chips button{font:600 15px "Readex Pro",sans-serif;padding:9px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background-color .3s,color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.chips button:hover{transform:translateY(-3px)}
.chips button[aria-pressed="true"]{background:var(--brand2);border-color:var(--brand2);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gi{position:relative;margin:0;border-radius:18px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;background:#111;transition:opacity .3s,transform .3s}
.gi[hidden]{display:none}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.gi:hover img{transform:scale(1.08)}
.gi figcaption{position:absolute;inset-inline:0;bottom:0;padding:38px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font:600 15px "Readex Pro",sans-serif;opacity:0;transform:translateY(30%);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.gi:hover figcaption,.gi:focus-visible figcaption{opacity:1;transform:none}
@media(hover:none){.gi figcaption{opacity:1;transform:none}}
.gi.out{opacity:0;transform:scale(.85)}
.gi.sh{animation:gi .55s cubic-bezier(.2,.8,.2,1)}
@keyframes gi{from{opacity:0;transform:scale(.85)}}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,6,25,.9);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.lb.o{opacity:1;visibility:visible;transition-delay:0s}
.lb img{max-width:100%;max-height:88vh;border-radius:16px;transform:scale(.88);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.lb.o img{transform:none}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);inset-inline-end:16px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;transition:background-color .3s,transform .3s}
.lb .x:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}
@media(max-width:820px){.ba-grid{grid-template-columns:1fr}.ba{max-width:440px;margin:0 auto;width:100%}}
body.sp{overflow:hidden}
#sp{position:fixed;inset:0;z-index:100;background:var(--logo);display:grid;place-items:center;cursor:pointer;clip-path:circle(150% at 50% 50%);transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
#sp.out{clip-path:circle(0% at 50% 50%)}
.sp-in{text-align:center;width:min(86vw,560px);transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .6s}
#sp.out .sp-in{transform:scale(1.3);opacity:0}
.sp-in img{width:100%;display:block;opacity:0}
#sp.rd .sp-in img{animation:spl 1.4s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes spl{from{opacity:0;transform:scale(.7);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
.sp-in p{margin:18px 0 0;color:var(--ivory);font:500 clamp(16px,4vw,22px) "Readex Pro",sans-serif;opacity:0}
#sp.rd .sp-in p{animation:wi 1s 1.1s forwards}
.sp-bar{direction:ltr;height:3px;width:60%;margin:26px auto 0;background:rgba(246,240,230,.2);border-radius:3px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--ivory);transform-origin:left;transform:scaleX(0)}
#sp.rd .sp-bar i{animation:spb 2.4s linear .6s forwards}
@keyframes spb{to{transform:scaleX(1)}}
.sp-skip{position:absolute;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;color:var(--ivory);font:400 13px "Readex Pro",sans-serif;opacity:0}
#sp.rd .sp-skip{animation:wi 1s 1.8s forwards;--o:.6}
body:not(.go) .hero .w,body:not(.go) .hero p,body:not(.go) .hero .btns,body:not(.go) .logo-big{animation-play-state:paused}

/* buttons v2 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:var(--ivory);font:600 17px "Readex Pro",sans-serif;text-decoration:none;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,background-color .3s,border-color .3s,color .3s}
.btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6);transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.btn:active{transform:scale(.96)}
.btn svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.btn:hover svg{transform:scale(1.18) rotate(-8deg)}
.btn.m{background:var(--ivory);border-color:var(--ivory);color:#2E2360}
.btn.m:hover{background:#fff;border-color:#fff}
.btn.wa{background:linear-gradient(135deg,#25D366,#128C4A);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(18,140,74,.35)}
.btn.wa:hover{background:linear-gradient(135deg,#2BE070,#15A054);box-shadow:0 16px 34px rgba(18,140,74,.5)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none;z-index:-1}
.btn.m .rip{background:rgba(67,52,127,.22)}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* contact split */
.cs{display:grid;grid-template-columns:.9fr 1.1fr;border-radius:32px;overflow:hidden;box-shadow:0 30px 70px rgba(67,52,127,.25)}
.cs-i{position:relative;overflow:hidden;background:linear-gradient(150deg,#2E2360,#43347F);color:var(--ivory);padding:44px 34px}
.cs-i::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#7B63E0;filter:blur(70px);opacity:.5;top:-80px;inset-inline-end:-80px}
.cs-i>*{position:relative}
.cs-i h2{color:inherit;margin-bottom:8px}
.cs-i p{margin:0 0 26px;opacity:.85}
.ways{display:grid;gap:12px}
.way{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);text-decoration:none;color:inherit;transition:transform .4s cubic-bezier(.2,.8,.2,1),background-color .3s,border-color .3s}
.way:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);transform:translateY(-3px)}
.way i{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.way svg{width:24px;height:24px;color:#fff;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.way small{display:block;opacity:.7;font-size:13px;line-height:1.3}
.way b{font:600 17px "Readex Pro",sans-serif}
.cs-f{background:var(--surface);padding:40px 34px}
.cs-f h3{font-size:25px;color:var(--ink);margin-bottom:4px}
.cs-f .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.ff{position:relative;display:block}
.ff svg{position:absolute;inset-inline-start:14px;top:17px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;pointer-events:none}
.ff input,.ff textarea{width:100%;padding:24px 14px 8px;padding-inline-start:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;color-scheme:light dark}
.ff textarea{min-height:108px;resize:vertical}
.ff input::placeholder,.ff textarea::placeholder{color:transparent}
.ff span{position:absolute;inset-inline-start:46px;top:16px;color:var(--muted);font-size:16px;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),color .3s}
html[dir=rtl] .ff span{transform-origin:right top}
html[dir=ltr] .ff span{transform-origin:left top}
.ff input:focus,.ff textarea:focus{border-color:var(--brand2);background:var(--surface);box-shadow:0 0 0 4px rgba(107,88,200,.18);outline:none}
.ff input:focus~span,.ff input:not(:placeholder-shown)~span,.ff textarea:focus~span,.ff textarea:not(:placeholder-shown)~span,.ff.d span{transform:translateY(-10px) scale(.78);color:var(--brand2)}
.ff:focus-within svg{stroke:var(--brand2)}
.kl{font:600 15px "Readex Pro",sans-serif;color:var(--muted);margin:4px 0 -4px}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds button{display:inline-flex;align-items:center;gap:8px;font:600 15px "Readex Pro",sans-serif;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:background-color .3s,border-color .3s,color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.kinds button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:background-color .3s,transform .3s cubic-bezier(.2,1.4,.3,1)}
.kinds button:hover{border-color:var(--brand2);transform:translateY(-2px)}
.kinds button[aria-pressed="true"]{background:var(--brand2);border-color:var(--brand2);color:#fff}
.kinds button[aria-pressed="true"]::before{background:#fff;transform:scale(1.5)}
.cs-f .btn.wa{width:100%;margin-top:6px}
@media(max-width:820px){.cs{grid-template-columns:1fr}.cs-i,.cs-f{padding:30px 22px}}
.cs-f{--fb:color-mix(in srgb,var(--brand) 50%,var(--surface))}
.ff input,.ff textarea{background:var(--tint);border:2px solid var(--fb);box-shadow:0 3px 10px rgba(67,52,127,.1);min-height:60px}
.ff textarea{min-height:112px}
.ff span{color:var(--ink);opacity:.75}
.ff svg{stroke:var(--brand)}
.ff input:hover,.ff textarea:hover{border-color:var(--brand2)}
.kinds button{background:var(--tint);border:2px solid var(--fb);color:var(--ink)}
.kinds button::before{background:var(--fb)}

/* fixes v5 */
.hero .wrap{width:100%}
.logo-big{width:min(100%,340px);aspect-ratio:1}
.logo-big .card{width:100%;height:100%;border-radius:50%;padding:0;display:grid;place-items:center;border:6px solid rgba(246,240,230,.35)}
.logo-big img{width:76%}
.ring{inset:-24px;border-radius:50%}
@media(max-width:820px){.logo-big{width:230px}}
.sp-in{position:relative}
.sp-in p{position:absolute;inset-inline:0;top:100%;margin:26px 0 0}
.sp-bar{position:absolute;left:20%;top:calc(100% + 92px);margin:0}
@media(min-width:900px){.cs-f{padding:44px 40px}.cs-i{padding:48px 40px}}
/* tooth on logo */
.sp-tooth{position:absolute;bottom:100%;left:50%;width:84px;margin-bottom:12px;color:var(--ivory);opacity:0;transform:translate(-50%,-70px) scale(.5)}
.sp-tooth svg{display:block;width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
#sp.rd .sp-tooth{animation:tdrop 1.1s cubic-bezier(.3,1.5,.4,1) .35s forwards}
#sp.rd .sp-tooth svg{animation:tf 3.6s ease-in-out 1.6s infinite}
@keyframes tdrop{to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tf{50%{transform:translateY(-6px)}}
.sk{position:absolute;width:16px;height:16px;background:#fff;opacity:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.sk.a{top:4px;right:-4px}.sk.b{top:40px;left:-12px;width:11px;height:11px}
#sp.rd .sk{animation:tw 1.8s ease-in-out 1.5s infinite}
#sp.rd .sk.b{animation-delay:2.4s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.logo-big .card{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ht{width:54px;height:57px;color:var(--ivory);margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));animation:tf 3.6s ease-in-out infinite}
@media(max-width:820px){.ht{width:40px;height:42px;margin-bottom:6px}.sp-tooth{width:68px}}
.logo-big .card .ht{width:54px;height:57px;margin-bottom:10px;color:var(--ivory)}
@media(max-width:820px){.logo-big .card .ht{width:40px;height:42px;margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}html{scroll-behavior:auto}.w,.hero p,.btns,.rv{opacity:1;transform:none}}
</style>
</head>

<section id="process" style="background:var(--tint)"><div class="wrap">
  <h2 class="rv" data-ar="إزاي تشتغل معانا" data-en="How to work with us"></h2>
  <ol class="steps" id="steps" style="margin-top:36px">
    <li data-n="1" class="rv"><b data-ar="ابعت الحالة" data-en="Send the case"></b><span data-ar="الطبعة أو الاسكان مع بيانات المريض ودرجة اللون." data-en="The impression or scan, with patient details and shade."></span></li>
    <li data-n="2" class="rv"><b data-ar="نصمم" data-en="We design"></b><span data-ar="تصميم رقمي ونتواصل معاك لو الحالة محتاجة تعديل." data-en="Digital design, and we contact you if the case needs adjustments."></span></li>
    <li data-n="3" class="rv"><b data-ar="نصنّع" data-en="We fabricate"></b><span data-ar="تصنيع وتشطيب وفحص جودة قبل التسليم." data-en="Fabrication, finishing and a quality check before delivery."></span></li>
    <li data-n="4" class="rv"><b data-ar="تستلم" data-en="You receive"></b><span data-ar="التركيبة جاهزة للتجربة في العيادة." data-en="The restoration, ready for try-in at your clinic."></span></li>
  </ol>
</div></section>

<section id="faq"><div class="wrap" style="max-width:760px">
